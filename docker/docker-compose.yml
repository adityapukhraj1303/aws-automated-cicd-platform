services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aws-cicd-app-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=local-dev
      - AWS_REGION=ap-south-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: false
    networks:
      - cicd-net

networks:
  cicd-net:
    driver: bridge
