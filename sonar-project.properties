# ==============================================================================
# SonarQube Project Configuration: AWS Automated CI/CD Platform
# ==============================================================================

# Required Project Metadata
sonar.projectKey=aws-automated-cicd-platform
sonar.projectName=AWS Automated CI/CD Platform
sonar.projectVersion=1.0.0
sonar.description=Cloud-Native CI/CD Platform with Docker, Jenkins, SonarQube & Terraform on AWS

# Source directories to analyze (HTML, CSS, JS at root level)
sonar.sources=.

# File encoding
sonar.sourceEncoding=UTF-8

# Exclusions - skip terraform state, docker artifacts, node_modules, etc.
sonar.exclusions=terraform/**,node_modules/**,**/.terraform/**,**/*.tfstate,**/*.tfstate.*,coverage/**,**/*.md

# Quality Gate Settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# HTML/CSS/JS inclusions for scan
sonar.inclusions=*.html,*.css,*.js
