# ==============================================================================
# SonarQube Project Configuration: AWS Automated CI/CD Platform
# ==============================================================================

# Required Project Metadata
sonar.projectKey=aws-automated-cicd-platform
sonar.projectName=AWS Automated CI/CD Platform
sonar.projectVersion=1.0.0
sonar.description=Automated CI/CD Platform with Infrastructure as Code & AWS Deployment

# Source code directories to analyze
sonar.sources=app,scripts,jenkins/scripts

# Test directories
sonar.tests=tests

# File encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=terraform/**,node_modules/**,coverage/**,test-results/**,**/*.md,**/*.json

# Quality Gate Settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Shell / Bash static analysis integration (ShellCheck reports)
sonar.shellcheck.reportPath=test-results/shellcheck-report.xml
sonar.testExecutionReportPaths=test-results/bats-report.xml

# SonarQube Scanner Inclusions
sonar.inclusions=**/*.sh,app/public/**/*.html
